<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Downloads Automáticos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
        a { color: #0066cc; text-decoration: none; font-size: 18px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Arquivos Disponíveis</h1>
    <ul id="lista-arquivos">Carregando arquivos...</ul>

    <script>
        // CONFIGURAÇÃO: Altere com seus dados do GitHub
        const USERNAME = 'wardencraft';
        const REPO = 'search';
        const PATH = 'library/books'; // Nome da pasta onde estão os arquivos

        const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${PATH}`;

        async function buscarArquivos() {
            try {
                const response = await fetch(url);
                const arquivos = await response.json();
                const listaUls = document.getElementById('lista-arquivos');
                listaUls.innerHTML = ''; // Limpa o "Carregando..."

                if (!Array.isArray(arquivos)) {
                    listaUls.innerHTML = '<li>Nenhum arquivo encontrado ou erro na configuração.</li>';
                    return;
                }

                arquivos.forEach(arquivo => {
                    // Ignora subpastas, foca apenas em arquivos
                    if (arquivo.type === 'file') {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        
                        // download_url é o link direto para baixar o arquivo bruto
                        a.href = arquivo.download_url; 
                        a.textContent = arquivo.name;
                        a.setAttribute('download', ''); 
                        
                        li.appendChild(a);
                        listaUls.appendChild(li);
                    }
                });
            } catch (erro) {
                console.error('Erro ao buscar arquivos:', erro);
                document.getElementById('lista-arquivos').innerHTML = '<li>Erro ao carregar arquivos.</li>';
            }
        }

        buscarArquivos();
    </script>
</body>
</html>
